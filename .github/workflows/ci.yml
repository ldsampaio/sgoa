# CI: smoke do contrato de sessão contra Postgres + build do frontend.
# Postgres é o único driver (decisão do plano de identidade unificada) — a perna
# SQLite foi removida. Roda em push para main/develop e em PRs.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sgoa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/backend/package-lock.json

      - name: Backend deps
        working-directory: dev/backend
        run: npm ci

      # O schema `auth` é do saga: o sgoa só lê. Em CI o saga não roda, então o fixture
      # cria `auth` no banco de teste (mesma DDL de saga/db/schema.sql) antes do boot —
      # as FK do schema sgoa referenciam auth.users.
      - name: "Schema auth (fixture, dono: saga)"
        working-directory: dev/backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sgoa_test
        run: psql "$DATABASE_URL" -f tests/fixtures/auth-schema.sql

      # Sem Redis no runner, o verifier não confirma liveness e responde 503 —
      # que é exatamente o caminho que o smoke aceita (falha fechada). Isso só vale
      # porque a reconexão do cliente é limitada: sem limite o connect() pendura.
      - name: Smoke (Postgres)
        working-directory: dev/backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sgoa_test
        run: npm run smoke

      - name: Testes do contrato de sessão
        working-directory: dev/backend
        run: npm test

      - name: Frontend build
        working-directory: dev/frontend
        run: npm ci && npm run build
