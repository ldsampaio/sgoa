# SGOA — ambiente local (API + Worker + Kafka)
# Uso: docker compose up -d (na pasta dev/) para subir somente o Kafka,
# ou docker compose --profile worker up -d para incluir o worker de resultados.
# A API e o frontend continuam rodando com npm (backend:3000, frontend:5173).

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: sgoa-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,DOCKER://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: sgoa-kafka-cluster-01
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Worker que consome sgoa.avaliacoes.resultados e atualiza o SGOA.
  # Roda com o mesmo código do backend; usa o .env do backend.
  sgoa-worker:
    image: node:22-alpine
    container_name: sgoa-worker
    working_dir: /app
    volumes:
      - ./backend:/app
    command: ["npm", "run", "worker"]
    env_file:
      - ./backend/.env
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - kafka
    restart: unless-stopped
    profiles: ["worker"]

  # Agente interno: consome os pedidos, extrai o texto e avalia via OpenRouter.
  # NÃO rode junto com um agente externo (duplicaria as avaliações).
  # Requer OPENROUTER_API_KEY no ./backend/.env.
  sgoa-agent:
    image: node:22-alpine
    container_name: sgoa-agent
    working_dir: /app
    volumes:
      - ./backend:/app
    command: ["npm", "run", "agent"]
    env_file:
      - ./backend/.env
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - kafka
    restart: unless-stopped
    profiles: ["agent"]

  # Worker de avisos de prazo: mensagem + notificação + e-mail (stub) ao aluno.
  # Roda com o mesmo código do backend; usa o .env do backend.
  sgoa-lembretes:
    image: node:22-alpine
    container_name: sgoa-lembretes
    working_dir: /app
    volumes:
      - ./backend:/app
    command: ["npm", "run", "lembretes"]
    env_file:
      - ./backend/.env
    restart: unless-stopped
    profiles: ["lembretes"]

volumes:
  kafka-data:
